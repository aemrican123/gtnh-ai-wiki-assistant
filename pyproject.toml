[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gtnh-assistant"
version = "0.1.0"
description = "Local, source-grounded GT New Horizons wiki assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "lxml>=5.3,<7",
  "protego>=0.4,<1", "sentence-transformers>=3.4,<6", "chromadb>=1,<2",
  "tiktoken>=0.9,<1", "streamlit>=1.44,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3", "python-dotenv>=1,<2", "filelock>=3.17,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "respx>=0.22,<1", "ruff>=0.11,<1"]

[project.scripts]
gtnh = "gtnh_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

